<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一隐口腔 — 方案二「青瓷」</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: #F5F0E8;
    overflow: hidden;
  }

  /* === 宣纸纹理背景 === */
  .bg-texture {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 30% 20%, rgba(90,143,123,0.06), transparent),
      radial-gradient(ellipse 50% 50% at 70% 80%, rgba(90,143,123,0.04), transparent);
  }
  .bg-texture::after {
    content: ''; position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: 0.6;
  }

  /* === 水墨晕染装饰 === */
  .ink-wash {
    position: fixed; pointer-events: none; z-index: 0;
    border-radius: 50%; filter: blur(60px);
  }
  .ink-1 {
    width: 350px; height: 350px; background: rgba(90,143,123,0.10);
    top: -5%; right: -8%;
    animation: inkFloat 18s ease-in-out infinite;
  }
  .ink-2 {
    width: 280px; height: 280px; background: rgba(120,100,80,0.06);
    bottom: 5%; left: -5%;
    animation: inkFloat 22s ease-in-out infinite reverse;
  }

  @keyframes inkFloat {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-15px, 10px) scale(1.08); }
  }

  /* === 页面 === */
  .page {
    position: relative; z-index: 1;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
  }

  /* === 卡片 === */
  .card {
    width: 100%; max-width: 400px;
    background: rgba(255,255,255,0.92);
    border-radius: 16px;
    border: 1px solid rgba(90,143,123,0.15);
    box-shadow: 0 16px 40px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.02);
    padding: 52px 44px 36px;
    animation: cardEnter 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    opacity: 0; transform: translateY(20px);
  }

  @keyframes cardEnter {
    to { opacity: 1; transform: translateY(0); }
  }

  /* === 品牌 === */
  .brand {
    text-align: center; margin-bottom: 36px;
    animation: fadeInUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    opacity: 0; transform: translateY(20px);
  }

  .logo-ring {
    width: 72px; height: 72px; margin: 0 auto 18px;
    border-radius: 50%;
    border: 2px solid rgba(90,143,123,0.3);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .logo-ring::before {
    content: ''; position: absolute; inset: 6px;
    border-radius: 50%; border: 1px solid rgba(90,143,123,0.15);
  }
  .logo-ring svg { stroke: #5A8F7B; stroke-width: 1.5; fill: none; }

  .brand h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 26px; font-weight: 600; color: #2C3E35;
    letter-spacing: 0.12em;
  }
  .divider-line {
    width: 32px; height: 2px; background: #5A8F7B;
    margin: 14px auto 10px; border-radius: 1px;
    animation: lineGrow 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
    transform: scaleX(0);
  }
  @keyframes lineGrow { to { transform: scaleX(1); } }

  .brand p {
    font-size: 12px; color: #8A9A8E; letter-spacing: 0.15em;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* === 细线输入框（东方风格） === */
  .input-group {
    position: relative; margin-bottom: 28px;
    animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    opacity: 0; transform: translateY(12px);
  }
  .input-group:nth-child(1) { animation-delay: 0.4s; }
  .input-group:nth-child(2) { animation-delay: 0.5s; }

  .input-group input {
    width: 100%; height: 44px;
    padding: 8px 4px;
    font-size: 15px; color: #2C3E35;
    background: transparent; border: none;
    border-bottom: 1.5px solid rgba(90,143,123,0.2);
    border-radius: 0;
    outline: none;
    font-family: 'Noto Sans SC', sans-serif;
    transition: border-color 0.3s ease;
  }
  .input-group input:focus {
    border-bottom-color: #5A8F7B;
  }
  .input-group label {
    position: absolute; left: 4px; top: 50%;
    transform: translateY(-50%);
    font-size: 14px; color: #A0A0A0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .input-group input:focus + label,
  .input-group input:not(:placeholder-shown) + label {
    top: -4px; transform: translateY(0) scale(0.8);
    color: #5A8F7B;
  }

  /* === 记住密码 === */
  .checkbox-wrap {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 28px; cursor: pointer;
    animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
    opacity: 0; transform: translateY(12px);
  }
  .checkbox-wrap input {
    width: 16px; height: 16px; accent-color: #5A8F7B; cursor: pointer;
  }
  .checkbox-wrap span { font-size: 13px; color: #6B6B6B; }

  /* === 按钮 === */
  .btn-login {
    width: 100%; height: 46px;
    background: #5A8F7B; color: #FFFFFF;
    border: none; border-radius: 6px;
    font-size: 15px; font-weight: 500;
    font-family: 'Noto Sans SC', sans-serif;
    cursor: pointer; letter-spacing: 0.1em;
    transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative; overflow: hidden;
    animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards;
    opacity: 0; transform: translateY(12px);
  }
  .btn-login::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s ease;
  }
  .btn-login:hover {
    background: #4A7F6B;
    box-shadow: 0 4px 16px rgba(90,143,123,0.25);
  }
  .btn-login:hover::after { transform: translateX(100%); }
  .btn-login:active { transform: scale(0.98); }

  /* === Footer === */
  .footer {
    margin-top: 28px; text-align: center;
    font-size: 11px; color: #A0A0A0; letter-spacing: 0.05em;
    animation: fadeIn 0.4s ease 0.9s forwards; opacity: 0;
  }
  .footer a { color: #8A9A8E; text-decoration: none; }
  .footer a:hover { color: #5A8F7B; }

  @keyframes fadeIn { to { opacity: 1; } }

  @media (max-width: 480px) {
    .card { padding: 40px 28px 28px; }
    .brand h1 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="bg-texture"></div>
  <div class="ink-wash ink-1"></div>
  <div class="ink-wash ink-2"></div>

  <div class="page">
    <div class="card">
      <div class="brand">
        <div class="logo-ring">
          <svg width="26" height="26" viewBox="0 0 24 24">
            <path d="M12 2C7.5 2 4 6.5 4 10c0 3.5 3 7 8 12 5-5 8-8.5 8-12 0-3.5-3.5-8-8-8z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <h1>一隐口腔</h1>
        <div class="divider-line"></div>
        <p>诊所管理系统</p>
      </div>

      <form onsubmit="return false;">
        <div class="input-group">
          <input type="text" id="user" placeholder=" " autocomplete="off">
          <label for="user">用户名</label>
        </div>
        <div class="input-group">
          <input type="password" id="pass" placeholder=" ">
          <label for="pass">密码</label>
        </div>
        <label class="checkbox-wrap">
          <input type="checkbox">
          <span>记住密码</span>
        </label>
        <button class="btn-login" type="button">登 录</button>
      </form>

      <div class="footer">
        湘ICP备2026011054号 · 一隐口腔诊所
      </div>
    </div>
  </div>
</body>
</html>
