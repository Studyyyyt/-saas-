services:
  mysql:
    image: mysql:9.6
    container_name: clinic-mysql
    restart: unless-stopped
    environment:
      # MySQL root 账号密码（最高权限）
      MYSQL_ROOT_PASSWORD: clinic_root_pass
      # 自动创建的数据库名称
      MYSQL_DATABASE: clinic_system
      # 应用连接账号
      MYSQL_USER: clinic_user
      # 应用连接密码
      MYSQL_PASSWORD: clinic_pass
      # 确保客户端使用 UTF-8 编码，避免中文乱码
      LANG: C.UTF-8
    ports:
      - "3306:3306"
    volumes:
      # 数据库文件挂载到本地项目目录 ./mysql-data/
      - ./mysql-data:/var/lib/mysql
      - ./sql/init/database_init.sql:/docker-entrypoint-initdb.d/database_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-clinic_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - clinic-network

  backend:
    image: clinic-saas/backend:v1.0.0
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: clinic-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/clinic_system?autoReconnect=true&useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
      DB_USER: ${DB_USER:-clinic_user}
      DB_PASSWORD: ${DB_PASSWORD:-clinic_pass}
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-http://host.docker.internal:3001}
      SECURITY_PATIENT_ADMIN_SECONDARY_PASSWORD: ${SECURITY_PATIENT_ADMIN_SECONDARY_PASSWORD:-246810}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom}
    ports:
      - "8080:8080"
    volumes:
      # 患者影像上传文件挂载到本地项目目录 ./patient-uploads/
      - ./patient-uploads:/root/.local/uploads/patient-images
    depends_on:
      mysql:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/auth/needs-init"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - clinic-network

  frontend:
    image: clinic-saas/frontend:v1.0.0
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: clinic-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "7070:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - clinic-network

networks:
  clinic-network:
    driver: bridge
