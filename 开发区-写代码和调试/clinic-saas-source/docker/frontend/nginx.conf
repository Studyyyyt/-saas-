server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 代理到后端服务（通过环境变量替换）

    # 所有 /api/ 开头的请求统一代理到后端（覆盖 AI、Webhook、文档等新接口）
    location ~ ^/api/ {
        proxy_pass __BACKEND_URL__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 涵盖所有后端 Controller 路径前缀
    location ~ ^/(loginController|clinics|accounts|appointments|patients|treatments|finances|doctors|inventory|treatment-catalog|insurances|business-analysis|admin-report-portal|medical-records|lab-[^/]+|materials|material-[^/]+|patientDetail|wechat|uploads|actuator|error|auth|consultations|followups|risk-tags|patient-insights|medical-record-operations|patient-details|treatment-plans|purchases|patient-consent|patient-groups|medical-record-phrases|treatment-projects|treatment-project-categories|treatment-operations|patient-images|medical-record-templates|advertising-spending|role-menu-permissions|doctor-home-reminders|payment-channels|consent-template|file-transfer|roles) {
        proxy_pass __BACKEND_URL__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 前端路由 fallback（Vue SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
