# Docker 开发模式配置
# 特性：后端代码修改后自动热更新，前端需手动构建后生效
# 用法：
#   cd docker
#   docker compose -f docker-compose.dev.yml up -d
#
# 环境变量配置（推荐方式，无需修改代码文件）：
#   1. 复制 .env.example 为 .env:   cp .env.example .env
#   2. 编辑 .env 修改 LICENSE_SERVER_URL 等配置
#   3. docker compose -f docker-compose.dev.yml up -d
#
# 前端代码修改后需重新构建：
#   cd ../saas-vue-src && npm run build
#   cd ../docker && docker compose -f docker-compose.dev.yml restart frontend
#
# 只有修改 Dockerfile、docker-compose 文件或新增依赖时才需要重新 build：
#   docker compose -f docker-compose.dev.yml up -d --build

services:
  mysql:
    image: mysql:9.6
    container_name: clinic-mysql-dev
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: clinic_root_pass
      MYSQL_DATABASE: clinic_system
      MYSQL_USER: clinic_user
      MYSQL_PASSWORD: clinic_pass
      LANG: C.UTF-8
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data-dev:/var/lib/mysql
      - ./sql/init/database_init.sql:/docker-entrypoint-initdb.d/database_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-clinic_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - clinic-network

  backend:
    image: maven:3.9-eclipse-temurin-17
    container_name: clinic-backend-dev
    working_dir: /app
    command: >
      sh -c "mvn spring-boot:run -DskipTests"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/clinic_system?autoReconnect=true&useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
      DB_USER: ${DB_USER:-clinic_user}
      DB_PASSWORD: ${DB_PASSWORD:-clinic_pass}
      SECURITY_PATIENT_ADMIN_SECONDARY_PASSWORD: ${SECURITY_PATIENT_ADMIN_SECONDARY_PASSWORD:-246810}
      # 激活码服务地址（通过 IP 访问，不依赖 Docker 容器名）
      # Mac: http://host.docker.internal:3001
      # Linux: http://172.17.0.1:3001 或宿主机局域网 IP（如 192.168.x.x:3001）
      # 独立部署: http://<远程服务器IP>:3001
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-http://host.docker.internal:3001}
      LICENSE_ENABLED: ${LICENSE_ENABLED:-true}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom}
    ports:
      - "8080:8080"
    volumes:
      # 挂载本地源码，实现热更新
      - ../saas-springboot-src:/app
      # 挂载本地 Maven 缓存，避免重复下载依赖
      - ~/.m2:/root/.m2
      # 患者影像上传文件挂载
      - ./patient-uploads:/root/.local/uploads/patient-images
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - clinic-network

  # Easytoac 激活码服务（已独立部署，通过 IP 地址访问）
  # 如需通过 Docker Compose 一并启动，取消以下注释：
  # license-server:
  #   build:
  #     context: /Users/cherry/Documents/github/Easytoac
  #     dockerfile: Dockerfile
  #   container_name: clinic-license-server-dev
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=production
  #     - PORT=3000
  #   ports:
  #     - "3001:3000"
  #   volumes:
  #     - license-server-data:/app/prisma
  #   networks:
  #     - clinic-network

  frontend:
    image: nginx:alpine
    container_name: clinic-frontend-dev
    environment:
      # 后端代理地址（Nginx 配置中的占位符替换）
      BACKEND_URL: http://backend:8080
    ports:
      - "7070:80"
    volumes:
      # 挂载构建好的前端产物
      - ../saas-vue-src/dist:/usr/share/nginx/html:ro
      # 挂载 Nginx 配置模板（启动脚本会复制并替换占位符）
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf.template:ro
      # 挂载启动脚本（替换后端地址占位符）
      - ./frontend/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      backend:
        condition: service_started
    networks:
      - clinic-network

networks:
  clinic-network:
    driver: bridge
