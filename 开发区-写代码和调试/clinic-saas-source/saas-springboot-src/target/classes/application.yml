# ============================================
# 口腔门诊 SaaS 管理系统 - 主配置文件
#
# 配置加载优先级（从高到低）：
#   1. 环境变量（推荐生产环境使用）
#   2. 本文件中的默认值
#   3. JVM 系统属性
#
# Docker 环境下，环境变量通过 docker/.env 文件注入。
# 修改 docker/.env 后需重启容器才能生效。
# ============================================

spring:
  mvc:
    # URL 路径匹配策略：ant_path_matcher 兼容老版 Spring Boot 风格
    pathmatch:
      matching-strategy: ant_path_matcher
    # 当请求路径没有对应处理器时抛出异常（便于统一异常处理）
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # 禁用 Spring 默认的静态资源映射（前端由 Nginx 托管，不由 Spring Boot 提供）
      add-mappings: false
  flyway:
    # 数据库迁移配置
    enabled: true                 # 应用启动时自动执行迁移脚本
    baseline-on-migrate: true     # 首次运行时在数据库中创建 baseline 记录
    baseline-version: 0           # baseline 起始版本号
    clean-disabled: true          # 禁止执行 flyway clean（防止误删数据）
    validate-on-migrate: false    # 迁移时不校验脚本内容是否被篡改（开发环境友好）
    locations: classpath:db/migration  # 迁移脚本存放路径
  datasource:
    # 数据库连接配置
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接地址，通过环境变量 DB_URL 注入
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/clinic_system?autoReconnect=true&useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8}
    username: ${DB_USER:change_me}       # 数据库用户名
    password: ${DB_PASSWORD:change_me}   # 数据库密码
  servlet:
    multipart:
      # 文件上传大小限制
      max-file-size: 200MB
      max-request-size: 500MB


# --------------------------------------------
# 跨域配置（CORS）
# --------------------------------------------
cors:
  # 允许的跨域来源，多个用逗号分隔
  # 生产环境应配置为实际的前端域名，如 https://admin.yourdomain.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:7070,https://localhost:7070}

# --------------------------------------------
# 安全配置
# --------------------------------------------
security:
  # 患者管理模块的二级密码，用于删除患者等敏感操作
  # 建议生产环境修改为强密码
  patient-admin-secondary-password: ${SECURITY_PATIENT_ADMIN_SECONDARY_PASSWORD:246810}

# --------------------------------------------
# Swagger / OpenAPI 接口文档配置
# --------------------------------------------
springdoc:
  swagger-ui:
    # Swagger UI 页面标题
    title: "口腔门诊 SaaS 接口文档"
    # 接口分组按 Tag 排序
    tags-sorter: alpha
    # 接口按路径排序
    operations-sorter: alpha
    # 默认展开所有接口分组
    doc-expansion: list
    # 显示请求时长
    display-request-duration: true
    # 持久化认证信息
    persist-authorization: true
    # 默认模型展开深度
    default-models-expand-depth: 1
    #  deepLinking
    deep-linking: true
    # 显示扩展信息
    show-extensions: true
    # 显示通用扩展
    show-common-extensions: true
    # 自定义 CSS（可选，用于微调样式）
    # css: /swagger-custom.css
  api-docs:
    # API 文档路径
    path: /v3/api-docs
    # 启用 API 文档
    enabled: true

# --------------------------------------------
# 激活码授权服务配置
# --------------------------------------------
# 连接独立的 Easytoac 激活码验证服务
# Docker 开发环境默认为 http://license-server:3000
# 本地开发可改为 http://localhost:3001
license:
  server:
    url: ${LICENSE_SERVER_URL:http://192.168.1.158:3001}
  # 是否启用授权验证，开发环境可设为 false 跳过
  enabled: ${LICENSE_ENABLED:true}

# --------------------------------------------
# 企业微信机器人通知（可选）
# --------------------------------------------
# 配置企业微信机器人 Webhook 地址后，AI 经营分析任务完成时会
# 自动推送 Markdown 通知到企业微信群。
# 未配置或留空时，通知功能静默跳过，不影响系统运行。
wechat:
  webhook-url: ${WECHAT_WEBHOOK_URL:}

# --------------------------------------------
# MyBatis 配置
# --------------------------------------------
mybatis:
  configuration:
    # 关闭自动映射：实体类使用下划线命名与数据库字段保持一致
    map-underscore-to-camel-case: false
    # 开启日志打印（开发环境）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
