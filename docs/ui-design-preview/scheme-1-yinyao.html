<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一隐口腔 — 方案一「隐曜」</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F7F5F2;
    overflow: hidden;
  }

  /* === 背景金色粒子 === */
  .bg-particles {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(80px);
    animation: float 20s ease-in-out infinite;
  }
  .blob-1 { width: 400px; height: 400px; background: rgba(212,165,116,0.18); top: -10%; left: -5%; animation-delay: 0s; }
  .blob-2 { width: 300px; height: 300px; background: rgba(212,165,116,0.12); bottom: 10%; right: -5%; animation-delay: -7s; }
  .blob-3 { width: 250px; height: 250px; background: rgba(212,165,116,0.10); top: 40%; left: 60%; animation-delay: -14s; }
  .blob-4 { width: 180px; height: 180px; background: rgba(20,20,20,0.04); top: 60%; left: 10%; animation-delay: -5s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.05); }
    66% { transform: translate(-20px, 15px) scale(0.95); }
  }

  /* === 页面容器 === */
  .page {
    position: relative; z-index: 1;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
  }

  /* === 登录卡片 === */
  .card {
    width: 100%; max-width: 420px;
    background: #FFFFFF;
    border-radius: 24px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.06), 0 8px 16px rgba(0,0,0,0.02), 0 0 0 1px rgba(0,0,0,0.02);
    padding: 56px 48px 40px;
    animation: cardEnter 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    opacity: 0; transform: translateY(20px) scale(0.98);
  }

  @keyframes cardEnter {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* === 品牌区 === */
  .brand {
    text-align: center; margin-bottom: 40px;
    animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    opacity: 0; transform: translateY(20px);
  }

  .logo {
    width: 64px; height: 64px; margin: 0 auto 20px;
    border-radius: 18px;
    background: linear-gradient(135deg, #D4A574, #C49460);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(212,165,116,0.25);
  }
  .logo svg { stroke: #fff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .brand h1 {
    font-family: 'Noto Serif SC', 'Playfair Display', serif;
    font-size: 28px; font-weight: 700; color: #141414;
    letter-spacing: 0.04em; line-height: 1.2;
  }
  .brand p {
    font-size: 13px; color: #A0A0A0; margin-top: 6px;
    font-weight: 400; letter-spacing: 0.08em;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* === 浮动标签输入框 === */
  .input-group {
    position: relative; margin-bottom: 20px;
    animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    opacity: 0; transform: translateY(15px);
  }
  .input-group:nth-child(1) { animation-delay: 0.35s; }
  .input-group:nth-child(2) { animation-delay: 0.45s; }

  .input-group input {
    width: 100%; height: 52px;
    padding: 18px 16px 6px;
    font-size: 15px; color: #141414;
    background: #F3F2EF; border: 1px solid transparent;
    border-radius: 10px;
    outline: none; transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    font-family: 'Noto Sans SC', sans-serif;
  }
  .input-group input:focus {
    background: #FFFFFF;
    border-color: rgba(212,165,116,0.4);
    box-shadow: 0 0 0 4px rgba(212,165,116,0.08);
  }
  .input-group label {
    position: absolute; left: 16px; top: 50%;
    transform: translateY(-50%);
    font-size: 15px; color: #A0A0A0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    transform-origin: left top;
  }
  .input-group input:focus + label,
  .input-group input:not(:placeholder-shown) + label {
    top: 10px; transform: translateY(0) scale(0.78);
    color: #D4A574; font-weight: 500;
  }

  /* === 记住密码 === */
  .checkbox-wrap {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 24px; cursor: pointer;
    animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
    opacity: 0; transform: translateY(15px);
  }
  .checkbox-wrap input {
    width: 18px; height: 18px; accent-color: #D4A574; cursor: pointer;
  }
  .checkbox-wrap span {
    font-size: 13px; color: #6B6B6B;
  }

  /* === 登录按钮 === */
  .btn-login {
    width: 100%; height: 48px;
    background: linear-gradient(135deg, #D4A574, #C49460);
    color: #FFFFFF; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600;
    font-family: 'Noto Sans SC', sans-serif;
    cursor: pointer; position: relative; overflow: hidden;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px rgba(212,165,116,0.25);
    animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards;
    opacity: 0; transform: translateY(15px);
  }
  .btn-login:hover {
    box-shadow: 0 6px 20px rgba(212,165,116,0.35);
    transform: translateY(-1px);
  }
  .btn-login:active { transform: scale(0.98); }

  /* === Footer === */
  .footer {
    margin-top: 32px; text-align: center;
    font-size: 12px; color: #A0A0A0;
    animation: fadeIn 0.4s ease 0.9s forwards; opacity: 0;
  }
  .footer::before {
    content: ''; display: block;
    width: 40px; height: 1px; background: rgba(0,0,0,0.06);
    margin: 0 auto 16px;
  }
  .footer a { color: #A0A0A0; text-decoration: none; }
  .footer a:hover { color: #D4A574; }

  @keyframes fadeIn { to { opacity: 1; } }

  /* === 响应式 === */
  @media (max-width: 480px) {
    .card { padding: 40px 28px 32px; border-radius: 20px; }
    .brand h1 { font-size: 24px; }
  }
</style>
</head>
<body>
  <div class="bg-particles">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="page">
    <div class="card">
      <div class="brand">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24">
            <path d="M12 2C7.5 2 4 6.5 4 10c0 3.5 3 7 8 12 5-5 8-8.5 8-12 0-3.5-3.5-8-8-8z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <h1>一隐口腔</h1>
        <p>诊所管理系统</p>
      </div>

      <form onsubmit="return false;">
        <div class="input-group">
          <input type="text" id="user" placeholder=" " autocomplete="off">
          <label for="user">用户名</label>
        </div>
        <div class="input-group">
          <input type="password" id="pass" placeholder=" ">
          <label for="pass">密码</label>
        </div>
        <label class="checkbox-wrap">
          <input type="checkbox">
          <span>记住密码</span>
        </label>
        <button class="btn-login" type="button">登录</button>
      </form>

      <div class="footer">
        湘ICP备2026011054号 · <a href="#">一隐口腔诊所</a>
      </div>
    </div>
  </div>
</body>
</html>
