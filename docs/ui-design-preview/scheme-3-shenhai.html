<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一隐口腔 — 方案三「深海」</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: 'Noto Sans SC', 'Inter', -apple-system, sans-serif;
    background: #0F172A;
    overflow: hidden;
  }

  /* === 深海背景 === */
  .bg-deep {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(30,58,95,0.6), transparent),
      radial-gradient(ellipse 60% 60% at 20% 100%, rgba(30,58,95,0.4), transparent),
      radial-gradient(ellipse 50% 50% at 80% 100%, rgba(224,122,95,0.08), transparent);
  }

  /* === 光点粒子 === */
  .particle {
    position: absolute; border-radius: 50%;
    animation: drift 15s ease-in-out infinite;
  }
  .particle-1 {
    width: 3px; height: 3px; background: rgba(224,122,95,0.6);
    top: 20%; left: 30%; box-shadow: 0 0 8px rgba(224,122,95,0.4);
    animation-duration: 12s;
  }
  .particle-2 {
    width: 2px; height: 2px; background: rgba(107,143,168,0.5);
    top: 60%; left: 70%; box-shadow: 0 0 6px rgba(107,143,168,0.3);
    animation-duration: 18s; animation-delay: -5s;
  }
  .particle-3 {
    width: 4px; height: 4px; background: rgba(224,122,95,0.4);
    top: 40%; left: 80%; box-shadow: 0 0 10px rgba(224,122,95,0.3);
    animation-duration: 14s; animation-delay: -8s;
  }
  .particle-4 {
    width: 2px; height: 2px; background: rgba(255,255,255,0.3);
    top: 80%; left: 20%; box-shadow: 0 0 6px rgba(255,255,255,0.2);
    animation-duration: 20s; animation-delay: -3s;
  }
  .particle-5 {
    width: 3px; height: 3px; background: rgba(107,143,168,0.4);
    top: 15%; left: 65%; box-shadow: 0 0 8px rgba(107,143,168,0.3);
    animation-duration: 16s; animation-delay: -10s;
  }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0); opacity: 0.4; }
    25% { transform: translate(20px, -15px); opacity: 0.8; }
    50% { transform: translate(-10px, 10px); opacity: 0.6; }
    75% { transform: translate(15px, 5px); opacity: 0.9; }
  }

  /* === 页面 === */
  .page {
    position: relative; z-index: 1;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
  }

  /* === 卡片 === */
  .card {
    width: 100%; max-width: 420px;
    background: rgba(30, 58, 95, 0.55);
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 24px 48px rgba(0,0,0,0.3), 0 0 0 1px rgba(224,122,95,0.05) inset;
    padding: 52px 44px 40px;
    animation: cardEnter 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    opacity: 0; transform: translateY(24px) scale(0.96);
  }

  @keyframes cardEnter {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* === 品牌 === */
  .brand {
    text-align: center; margin-bottom: 36px;
    animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    opacity: 0; transform: translateY(20px);
  }

  .logo-glow {
    width: 64px; height: 64px; margin: 0 auto 18px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(224,122,95,0.9), rgba(212,100,70,0.9));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 30px rgba(224,122,95,0.3), 0 8px 24px rgba(0,0,0,0.2);
    position: relative;
  }
  .logo-glow::before {
    content: ''; position: absolute; inset: -2px;
    border-radius: 18px; background: linear-gradient(135deg, rgba(224,122,95,0.4), transparent);
    z-index: -1; filter: blur(8px);
  }
  .logo-glow svg { stroke: #fff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .brand h1 {
    font-size: 26px; font-weight: 700; color: #FFFFFF;
    letter-spacing: 0.06em;
  }
  .brand p {
    font-size: 13px; color: rgba(255,255,255,0.45);
    margin-top: 6px; letter-spacing: 0.08em;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* === 输入框 === */
  .input-group {
    position: relative; margin-bottom: 20px;
    animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    opacity: 0; transform: translateY(15px);
  }
  .input-group:nth-child(1) { animation-delay: 0.35s; }
  .input-group:nth-child(2) { animation-delay: 0.45s; }

  .input-group input {
    width: 100%; height: 50px;
    padding: 16px 16px 6px;
    font-size: 15px; color: #FFFFFF;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    outline: none;
    font-family: 'Noto Sans SC', sans-serif;
    transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .input-group input::placeholder { color: transparent; }
  .input-group input:focus {
    background: rgba(255,255,255,0.1);
    border-color: rgba(224,122,95,0.5);
    box-shadow: 0 0 0 3px rgba(224,122,95,0.1);
  }
  .input-group label {
    position: absolute; left: 16px; top: 50%;
    transform: translateY(-50%);
    font-size: 14px; color: rgba(255,255,255,0.4);
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    transform-origin: left top;
  }
  .input-group input:focus + label,
  .input-group input:not(:placeholder-shown) + label {
    top: 8px; transform: translateY(0) scale(0.75);
    color: #E07A5F;
  }

  /* === 记住密码 === */
  .checkbox-wrap {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 24px; cursor: pointer;
    animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
    opacity: 0; transform: translateY(15px);
  }
  .checkbox-wrap input {
    width: 16px; height: 16px;
    accent-color: #E07A5F; cursor: pointer;
  }
  .checkbox-wrap span { font-size: 13px; color: rgba(255,255,255,0.5); }

  /* === 按钮 === */
  .btn-login {
    width: 100%; height: 48px;
    background: linear-gradient(135deg, #E07A5F, #D4684E);
    color: #FFFFFF; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600;
    font-family: 'Noto Sans SC', sans-serif;
    cursor: pointer; position: relative; overflow: hidden;
    transition: all 0.2s ease;
    box-shadow: 0 4px 16px rgba(224,122,95,0.25), 0 0 20px rgba(224,122,95,0.1);
    animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards;
    opacity: 0; transform: translateY(15px);
  }
  .btn-login:hover {
    box-shadow: 0 6px 24px rgba(224,122,95,0.35), 0 0 30px rgba(224,122,95,0.15);
    transform: translateY(-1px);
  }
  .btn-login:active { transform: scale(0.98); }

  /* === Footer === */
  .footer {
    margin-top: 28px; text-align: center;
    font-size: 12px; color: rgba(255,255,255,0.3);
    animation: fadeIn 0.4s ease 0.9s forwards; opacity: 0;
  }
  .footer a { color: rgba(255,255,255,0.35); text-decoration: none; }
  .footer a:hover { color: #E07A5F; }

  @keyframes fadeIn { to { opacity: 1; } }

  @media (max-width: 480px) {
    .card { padding: 40px 28px 32px; border-radius: 16px; }
    .brand h1 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="bg-deep"></div>
  <div class="particle particle-1"></div>
  <div class="particle particle-2"></div>
  <div class="particle particle-3"></div>
  <div class="particle particle-4"></div>
  <div class="particle particle-5"></div>

  <div class="page">
    <div class="card">
      <div class="brand">
        <div class="logo-glow">
          <svg width="28" height="28" viewBox="0 0 24 24">
            <path d="M12 2C7.5 2 4 6.5 4 10c0 3.5 3 7 8 12 5-5 8-8.5 8-12 0-3.5-3.5-8-8-8z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <h1>一隐口腔</h1>
        <p>诊所管理系统</p>
      </div>

      <form onsubmit="return false;">
        <div class="input-group">
          <input type="text" id="user" placeholder=" " autocomplete="off">
          <label for="user">用户名</label>
        </div>
        <div class="input-group">
          <input type="password" id="pass" placeholder=" ">
          <label for="pass">密码</label>
        </div>
        <label class="checkbox-wrap">
          <input type="checkbox">
          <span>记住密码</span>
        </label>
        <button class="btn-login" type="button">登录</button>
      </form>

      <div class="footer">
        湘ICP备2026011054号 · 一隐口腔诊所
      </div>
    </div>
  </div>
</body>
</html>
