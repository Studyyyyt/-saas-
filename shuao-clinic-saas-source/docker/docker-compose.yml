services:
  mysql:
    image: mysql:9.6
    container_name: clinic-mysql
    restart: unless-stopped
    environment:
      # MySQL root 账号密码（最高权限）
      MYSQL_ROOT_PASSWORD: clinic_root_pass
      # 自动创建的数据库名称
      MYSQL_DATABASE: clinic_system
      # 应用连接账号
      MYSQL_USER: clinic_user
      # 应用连接密码
      MYSQL_PASSWORD: clinic_pass
    ports:
      - "3306:3306"
    volumes:
      # 数据库文件挂载到本地项目目录 ./mysql-data/
      - ./mysql-data:/var/lib/mysql
      - ./database_init.sql:/docker-entrypoint-initdb.d/database_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-clinic_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - clinic-network

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: clinic-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/clinic_system?autoReconnect=true&useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
      DB_USER: ${DB_USER:-clinic_user}
      DB_PASSWORD: ${DB_PASSWORD:-clinic_pass}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      WECHAT_DELIVERY_MODE: ${WECHAT_DELIVERY_MODE:-mock}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_NOTICE_BASE_URL: ${WECHAT_NOTICE_BASE_URL:-https://example.com}
      WECHAT_BIND_BASE_URL: ${WECHAT_BIND_BASE_URL:-https://example.com}
      SECURITY_PATIENT_ADMIN_SECONDARY_PASSWORD: ${SECURITY_PATIENT_ADMIN_SECONDARY_PASSWORD:-246810}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom}
    ports:
      - "8080:8080"
    volumes:
      # 患者影像上传文件挂载到本地项目目录 ./patient-uploads/
      - ./patient-uploads:/root/.local/uploads/patient-images
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/patients/selectAll?page=1&size=1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - clinic-network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: clinic-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "7070:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - clinic-network

  # 可选：Nginx 反向代理（生产环境推荐启用）
  nginx:
    image: nginx:alpine
    container_name: clinic-nginx
    restart: unless-stopped
    profiles:
      - prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - clinic-network


networks:
  clinic-network:
    driver: bridge
